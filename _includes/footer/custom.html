<!-- Lightbox for travel photo grids -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img alt="">
  <div class="lightbox-cap"></div>
</div>
<script>
  (function () {
    var box = document.getElementById('lightbox');
    var img = box.querySelector('img'), cap = box.querySelector('.lightbox-cap');
    document.addEventListener('click', function (e) {
      var a = e.target.closest('.photo-grid a');
      if (!a) return;
      e.preventDefault();
      img.src = a.href;
      var fc = a.parentNode.querySelector('figcaption');
      cap.innerHTML = fc ? fc.innerHTML : '';
      box.classList.add('open');
    });
    function close() { box.classList.remove('open'); img.src = ''; }
    box.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  })();
</script>

<!-- end custom footer snippets -->
